services:
  db:
    image: postgres:16-alpine
    container_name: popin-lms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: popin_lms
      POSTGRES_USER: popin
      POSTGRES_PASSWORD: popin_local_password
    ports:
      - "5432:5432"
    volumes:
      - popin_lms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popin -d popin_lms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  popin_lms_postgres_data:
