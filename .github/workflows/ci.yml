name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: popin
          POSTGRES_PASSWORD: popin
          POSTGRES_DB: popin_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U popin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://popin:popin@localhost:5432/popin_lms_test
      AUTH_SECRET: ci-test-only-secret-at-least-32-characters
      JOBS_SECRET: ci-jobs-only-secret-at-least-32-characters
      NEXT_PUBLIC_AUTH_BYPASS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Prisma Generate
        run: npm run db:generate
      - name: Migrate
        run: npm run db:migrate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Web image
        run: docker build -f Dockerfile -t popin-lms:ci .

